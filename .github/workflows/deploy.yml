name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        env:
          # Supabase managed auth – set as Actions variables (publishable values only).
          # See README for required provider dashboard setup.
          # The build remains functional without these; users see an
          # "authentication not configured" notice.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Optional self-hosted Daemon API (chat + legacy Node auth)
          VITE_DAEMON_API_URL: ${{ vars.VITE_DAEMON_API_URL }}
          VITE_DAEMON_AUTH_API_URL: ${{ vars.VITE_DAEMON_AUTH_API_URL }}
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Unit tests (component)
        run: npm run test:unit

      - name: Server API tests
        run: npm run test:server

      - name: Verify build output
        run: npm run check:dist

      - name: Check imports
        run: npm run check:imports

      - name: Adaptive intelligence fixture suite
        run: npm run test:adaptive

      - name: Typecheck and build server
        run: |
          npm run server:typecheck
          npm run server:build

      - name: Typecheck CLI
        run: npm run cli:typecheck

      - name: CLI smoke tests
        run: npm run cli:smoke

      - name: Python prototype smoke test
        run: |
          if command -v python3 >/dev/null 2>&1; then
            npm run python:smoke
          else
            echo "python3 unavailable; skipping Python smoke test"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
