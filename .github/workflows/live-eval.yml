name: Live Evaluation

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-latest
    env:
      DAEMON_EVAL_LIVE: 'true'
      VITE_DAEMON_API_URL: ${{ secrets.DAEMON_EVAL_API_URL }}
      DAEMON_EVAL_API_TOKEN: ${{ secrets.DAEMON_EVAL_API_TOKEN }}
      DAEMON_EVAL_ORIGIN: ${{ secrets.DAEMON_EVAL_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate live-eval configuration
        id: config
        run: |
          if [ -z "${VITE_DAEMON_API_URL}" ] || [ -z "${DAEMON_EVAL_API_TOKEN}" ] || [ -z "${DAEMON_EVAL_ORIGIN}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping live evaluation: required secrets are not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: npm ci

      - name: Run live evaluation
        id: live_eval
        if: steps.config.outputs.configured == 'true'
        run: npx tsx tests/daemon-eval.mjs

      - name: Build evolution gate artifact
        if: always()
        run: |
          if [ "${{ steps.config.outputs.configured }}" = "true" ] && [ "${{ steps.live_eval.outcome }}" = "success" ]; then
            STATUS="passed"
            DETAIL="Live evaluation completed."
          elif [ "${{ steps.config.outputs.configured }}" = "true" ]; then
            STATUS="failed"
            DETAIL="Live evaluation failed."
          else
            STATUS="unavailable"
            DETAIL="Live evaluation secrets are not configured."
          fi

          cat > evolution-gate-results.json <<JSON
          {
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow": "live-eval",
            "gates": [
              { "gate": "regression", "status": "${STATUS}", "required": true, "detail": "${DETAIL}" }
            ]
          }
          JSON

      - name: Upload evolution gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolution-gate-results
          path: evolution-gate-results.json
          if-no-files-found: error
          retention-days: 14
