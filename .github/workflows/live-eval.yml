name: Live Evaluation

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Candidate version identifier for promotion-bound attestations
        required: false
        type: string
      candidate_snapshot_id:
        description: Candidate snapshot UUID for promotion-bound attestations
        required: false
        type: string
      run_id:
        description: Evolution run UUID for promotion-bound attestations
        required: false
        type: string

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-latest
    env:
      DAEMON_EVAL_LIVE: 'true'
      VITE_DAEMON_API_URL: ${{ secrets.DAEMON_EVAL_API_URL }}
      DAEMON_EVAL_API_TOKEN: ${{ secrets.DAEMON_EVAL_API_TOKEN }}
      DAEMON_EVAL_ORIGIN: ${{ secrets.DAEMON_EVAL_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate live-eval configuration
        id: config
        run: |
          if [ -z "${VITE_DAEMON_API_URL}" ] || [ -z "${DAEMON_EVAL_API_TOKEN}" ] || [ -z "${DAEMON_EVAL_ORIGIN}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping live evaluation: required secrets are not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: npm ci

      - name: Run typecheck gate
        id: typecheck_gate
        if: steps.config.outputs.configured == 'true'
        continue-on-error: true
        run: |
          npm run server:typecheck
          npm run cli:typecheck

      - name: Run lint gate
        id: lint_gate
        if: steps.config.outputs.configured == 'true'
        continue-on-error: true
        run: npm run lint

      - name: Run unit gate
        id: unit_gate
        if: steps.config.outputs.configured == 'true'
        continue-on-error: true
        run: npm run test:unit

      - name: Run build gate
        id: build_gate
        if: steps.config.outputs.configured == 'true'
        continue-on-error: true
        run: |
          npm run build
          npm run server:build

      - name: Run security scan gate
        id: security_scan_gate
        if: steps.config.outputs.configured == 'true'
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical

      - name: Run secret scan gate
        id: secret_scan_gate
        if: steps.config.outputs.configured == 'true'
        continue-on-error: true
        run: |
          export GITLEAKS_CONFIG_TOML="$(cat <<'EOF'
          title = "Project HELEN gitleaks config"
          [extend]
          useDefault = true

          [allowlist]
          description = "Allow documented placeholder secrets used in tests"
          regexes = [
            '''ghp_12345678901234567890''',
            '''sk-secret-token''',
            '''sk-ABCDEFGHIJKLMNOPQRSTUV''',
          ]
          EOF
          )"
          docker run --rm -e GITLEAKS_CONFIG_TOML -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            dir . --redact --no-banner

      - name: Run live evaluation
        id: live_eval
        if: steps.config.outputs.configured == 'true'
        continue-on-error: true
        env:
          DAEMON_EVAL_METRICS_PATH: /tmp/daemon-eval-metrics.json
        run: npx tsx tests/daemon-eval.mjs

      - name: Run resource budget gate
        id: resource_budget_gate
        if: steps.config.outputs.configured == 'true'
        continue-on-error: true
        env:
          DAEMON_EVAL_MAX_RUNTIME_MS: ${{ vars.DAEMON_EVAL_MAX_RUNTIME_MS }}
          DAEMON_EVAL_MAX_MEMORY_MB: ${{ vars.DAEMON_EVAL_MAX_MEMORY_MB }}
          DAEMON_EVAL_MAX_API_CALLS: ${{ vars.DAEMON_EVAL_MAX_API_CALLS }}
          DAEMON_EVAL_MAX_SPEND_USD: ${{ vars.DAEMON_EVAL_MAX_SPEND_USD }}
          DAEMON_EVAL_SPEND_USD_USED: ${{ vars.DAEMON_EVAL_SPEND_USD_USED }}
          LIVE_EVAL_STATUS: ${{ steps.live_eval.outcome }}
        run: |
          node <<'NODE'
          const fs = require('fs')

          if (process.env.LIVE_EVAL_STATUS !== 'success') {
            console.error('Resource budget gate requires a successful live evaluation workload.')
            process.exit(1)
          }

          const metricsPath = '/tmp/daemon-eval-metrics.json'
          if (!fs.existsSync(metricsPath)) {
            console.error('Resource budget gate requires live evaluation metrics.')
            process.exit(1)
          }

          const metrics = JSON.parse(fs.readFileSync(metricsPath, 'utf8'))
          const parseLimit = (value, fallback) => {
            const normalized = value?.trim?.() ?? ''
            if (!normalized) return fallback
            const parsed = Number(normalized)
            if (!Number.isFinite(parsed) || parsed < 0) {
              throw new Error(`Invalid budget value: ${value}`)
            }
            return parsed
          }

          const runtimeMs = parseLimit(String(metrics.runtimeMs ?? ''), Number.NaN)
          const memoryMb = parseLimit(String(metrics.memoryMb ?? ''), Number.NaN)
          const apiCalls = parseLimit(String(metrics.apiCalls ?? ''), Number.NaN)
          const maxRuntimeMs = parseLimit(process.env.DAEMON_EVAL_MAX_RUNTIME_MS, 600000)
          const maxMemoryMb = parseLimit(process.env.DAEMON_EVAL_MAX_MEMORY_MB, 512)
          const maxApiCalls = parseLimit(process.env.DAEMON_EVAL_MAX_API_CALLS, 2)
          const maxSpendUsd = parseLimit(process.env.DAEMON_EVAL_MAX_SPEND_USD, Number.POSITIVE_INFINITY)
          const spendUsd = parseLimit(process.env.DAEMON_EVAL_SPEND_USD_USED, 0)

          if (![runtimeMs, memoryMb, apiCalls].every(Number.isFinite)) {
            console.error('Resource budget gate requires finite live evaluation metrics.')
            process.exit(1)
          }
          if (metrics.failed) {
            console.error('Resource budget gate cannot pass when the live evaluation workload failed.')
            process.exit(1)
          }
          if (runtimeMs > maxRuntimeMs) {
            console.error(`Runtime budget exceeded: ${runtimeMs}ms > ${maxRuntimeMs}ms`)
            process.exit(1)
          }
          if (memoryMb > maxMemoryMb) {
            console.error(`Memory budget exceeded: ${memoryMb}MB > ${maxMemoryMb}MB`)
            process.exit(1)
          }
          if (apiCalls > maxApiCalls) {
            console.error(`API call budget exceeded: ${apiCalls} > ${maxApiCalls}`)
            process.exit(1)
          }
          if (spendUsd > maxSpendUsd) {
            console.error(`Spend budget exceeded: ${spendUsd} > ${maxSpendUsd}`)
            process.exit(1)
          }
          NODE

      - name: Resolve promotion binding identifiers
        id: binding
        if: always()
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          CANDIDATE_SNAPSHOT_ID: ${{ inputs.candidate_snapshot_id }}
          EVOLUTION_RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -n "$CANDIDATE_VERSION" ] && [ -n "$CANDIDATE_SNAPSHOT_ID" ] && [ -n "$EVOLUTION_RUN_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$CANDIDATE_VERSION" ] && [ -z "$CANDIDATE_SNAPSHOT_ID" ] && [ -z "$EVOLUTION_RUN_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Promotion-bound attestations require candidate_version, candidate_snapshot_id, and run_id together."
            exit 1
          fi

      - name: Build evolution gate artifact
        if: always() && steps.config.outputs.configured == 'true'
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          CANDIDATE_SNAPSHOT_ID: ${{ inputs.candidate_snapshot_id }}
          EVOLUTION_RUN_ID: ${{ inputs.run_id }}
          TYPECHECK_STATUS: ${{ steps.typecheck_gate.outcome }}
          LINT_STATUS: ${{ steps.lint_gate.outcome }}
          UNIT_STATUS: ${{ steps.unit_gate.outcome }}
          BUILD_STATUS: ${{ steps.build_gate.outcome }}
          SECURITY_SCAN_STATUS: ${{ steps.security_scan_gate.outcome }}
          SECRET_SCAN_STATUS: ${{ steps.secret_scan_gate.outcome }}
          RESOURCE_BUDGET_STATUS: ${{ steps.resource_budget_gate.outcome }}
          REGRESSION_STATUS: ${{ steps.live_eval.outcome }}
          LIVE_EVAL_CONFIGURED: ${{ steps.config.outputs.configured }}
        run: |
          node <<'NODE'
          const fs = require('fs')

          const gateStatus = (outcome, configured, detail) => {
            if (configured !== 'true') {
              return { status: 'unavailable', detail: 'Live evaluation secrets are not configured.' }
            }
            if (outcome === 'success') return { status: 'passed', detail }
            return { status: 'failed', detail: `${detail} failed.` }
          }

          const gateDefinitions = [
            ['typecheck', process.env.TYPECHECK_STATUS, 'Typecheck completed.'],
            ['lint', process.env.LINT_STATUS, 'Lint completed.'],
            ['unit', process.env.UNIT_STATUS, 'Unit tests completed.'],
            ['build', process.env.BUILD_STATUS, 'Build completed.'],
            ['security_scan', process.env.SECURITY_SCAN_STATUS, 'Security scan completed.'],
            ['secret_scan', process.env.SECRET_SCAN_STATUS, 'Secret scan completed.'],
            ['resource_budget', process.env.RESOURCE_BUDGET_STATUS, 'Resource budget check completed.'],
            ['regression', process.env.REGRESSION_STATUS, 'Live evaluation completed.'],
          ]

          const gates = gateDefinitions.map(([gate, outcome, detail]) => ({
            gate,
            required: true,
            ...gateStatus(outcome, process.env.LIVE_EVAL_CONFIGURED, detail),
          }))

          const doc = {
            generated_at: new Date().toISOString(),
            workflow: 'live-eval',
            candidate_sha: process.env.CANDIDATE_SHA,
            candidate_version: process.env.CANDIDATE_VERSION ?? '',
            candidate_snapshot_id: process.env.CANDIDATE_SNAPSHOT_ID ?? '',
            run_id: process.env.EVOLUTION_RUN_ID ?? '',
            gates,
          }

          fs.writeFileSync('evolution-gate-results.json', JSON.stringify(doc, null, 2))
          NODE

      - name: Upload evolution gate artifact
        if: always() && steps.binding.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evolution-gate-results
          path: evolution-gate-results.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce required gates passed
        if: steps.config.outputs.configured == 'true'
        run: |
          node -e "const fs=require('fs');const doc=JSON.parse(fs.readFileSync('evolution-gate-results.json','utf8'));const failed=(doc.gates||[]).find(g=>g.required&&g.status!=='passed');if(failed){console.error(`Required gate did not pass: ${failed.gate}`);process.exit(1)}"
