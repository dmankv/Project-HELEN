name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Unit tests (component)
        run: npm run test:unit

      - name: Adaptive profile tests
        run: npm run test:adaptive

      - name: Server API tests
        run: npm run test:server

      - name: Verify build output
        run: npm run check:dist

      - name: Check imports
        run: npm run check:imports

      - name: Typecheck and build server
        run: |
          npm run server:typecheck
          npm run server:build

      - name: Typecheck CLI
        run: npm run cli:typecheck

      - name: CLI smoke tests
        run: npm run cli:smoke

      - name: Python prototype smoke test
        run: |
          if command -v python3 >/dev/null 2>&1; then
            npm run python:smoke
          else
            echo "python3 unavailable; skipping Python smoke test"
          fi
