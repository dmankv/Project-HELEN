<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HELEN - Adaptive AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #0f172a;
            --color-surface: #1e293b;
            --color-surface-light: #334155;
            --color-text: #f1f5f9;
            --color-text-secondary: #cbd5e1;
            --color-border: #475569;
            --color-primary: #6366f1;
            --color-secondary: #8b5cf6;
            --color-success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--color-bg);
        }

        .header {
            background: linear-gradient(135deg, var(--color-surface), rgba(99, 102, 241, 0.1));
            border-bottom: 1px solid var(--color-border);
            padding: 1.5rem 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--color-text-secondary);
            font-size: 0.95rem;
        }

        .main-content {
            display: flex;
            flex: 1;
            gap: 1px;
            background-color: var(--color-border);
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background-color: var(--color-surface);
            border-right: 1px solid var(--color-border);
            padding: 1.5rem 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--color-bg);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            display: flex;
            gap: 0.75rem;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-avatar {
            font-size: 1.5rem;
            min-width: 2rem;
            display: flex;
            align-items: flex-start;
            padding-top: 0.5rem;
        }

        .message-content {
            max-width: 70%;
            padding: 0.875rem 1.125rem;
            border-radius: 0.75rem;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            color: white;
        }

        .message.helen .message-content {
            background-color: var(--color-surface-light);
            color: var(--color-text);
            border: 1px solid var(--color-border);
        }

        .typing-dots {
            display: flex;
            gap: 0.4rem;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--color-text-secondary);
            animation: bounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        .input-area {
            padding: 1.5rem;
            background-color: var(--color-surface);
            border-top: 1px solid var(--color-border);
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
        }

        #messageInput {
            flex: 1;
            padding: 0.875rem 1rem;
            background-color: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 0.5rem;
            color: var(--color-text);
            font-size: 0.95rem;
            font-family: inherit;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            outline: none;
            transition: all 0.2s ease;
        }

        #messageInput:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        #messageInput::placeholder {
            color: var(--color-text-secondary);
        }

        #sendBtn {
            padding: 0.875rem 1.5rem;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            min-height: 44px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        #sendBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .sidebar-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }

        .stats {
            background-color: var(--color-surface-light);
            border-radius: 0.5rem;
            padding: 1rem;
            font-size: 0.85rem;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            color: var(--color-text-secondary);
        }

        .stat-value {
            color: var(--color-primary);
            font-weight: 600;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--color-text-secondary);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .empty-state h2 {
            font-size: 1.5rem;
            color: var(--color-text);
            margin-bottom: 0.5rem;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--color-surface);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-surface-light);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-border);
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 HELEN</h1>
            <p>Adaptive AI Assistant - Type anything and learn together!</p>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <div>
                    <div class="sidebar-title">📊 Statistics</div>
                    <div class="stats">
                        <div class="stat-item">
                            <span>Messages:</span>
                            <span class="stat-value" id="msgCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span>Success Rate:</span>
                            <span class="stat-value" id="successRate">-</span>
                        </div>
                        <div class="stat-item">
                            <span>Learning Cycles:</span>
                            <span class="stat-value" id="learningCycles">0</span>
                        </div>
                        <div class="stat-item">
                            <span>Avg Confidence:</span>
                            <span class="stat-value" id="avgConfidence">-</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="chat-area">
                <div class="messages" id="messages">
                    <div class="empty-state">
                        <div class="empty-icon">🧠</div>
                        <h2>Hello! I'm HELEN</h2>
                        <p>Your adaptive AI assistant with memory and learning</p>
                        <p style="margin-top: 1rem; font-size: 0.9rem;">Start by typing any message below</p>
                    </div>
                </div>

                <div class="input-area">
                    <textarea id="messageInput" placeholder="Type your message here... (Shift+Enter for new line)" rows="1"></textarea>
                    <button id="sendBtn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // HELEN AI Core Logic
        class HELEN {
            constructor() {
                this.memory = new Map();
                this.conversationHistory = [];
                this.feedbackLog = [];
                this.interactionCount = 0;
                this.successfulResponses = 0;
                this.initMemory();
            }

            initMemory() {
                const categories = ['user-preference', 'conversation', 'learned-pattern', 'outcome', 'feedback'];
                categories.forEach(cat => this.memory.set(cat, []));
            }

            classifyIntent(userMessage) {
                const msg = userMessage.toLowerCase();
                const keywords = {
                    'help': 'request-assistance',
                    'how': 'request-explanation',
                    'what': 'request-information',
                    'why': 'request-reasoning',
                    'create': 'request-creation',
                    'generate': 'request-creation',
                    'summarize': 'request-summary',
                    'remember': 'memory-access'
                };

                for (const [keyword, intent] of Object.entries(keywords)) {
                    if (msg.includes(keyword)) return intent;
                }
                return 'general-inquiry';
            }

            estimateAmbiguity(userMessage) {
                let ambiguity = 0;
                if (userMessage.length < 10) ambiguity += 0.3;
                const questionMarks = userMessage.match(/\?/g);
                if (questionMarks && questionMarks.length > 2) ambiguity += 0.2;
                const vagueWords = ['thing', 'stuff', 'something', 'somehow', 'maybe', 'perhaps'];
                ambiguity += vagueWords.filter(w => userMessage.toLowerCase().includes(w)).length * 0.1;
                return Math.min(1, ambiguity);
            }

            retrieveMemory(userMessage) {
                const keywords = userMessage.toLowerCase().split(/\s+/).filter(w => w.length > 3);
                const relevant = [];
                this.memory.forEach((memories) => {
                    memories.forEach(mem => {
                        let score = 0;
                        keywords.forEach(keyword => {
                            if (mem.content.toLowerCase().includes(keyword)) score += 0.2;
                        });
                        if (score > 0) relevant.push({...mem, score});
                    });
                });
                return relevant.sort((a, b) => b.score - a.score).slice(0, 3);
            }

            async generateResponse(userMessage) {
                this.interactionCount++;
                const intent = this.classifyIntent(userMessage);
                const ambiguity = this.estimateAmbiguity(userMessage);
                const relevantMemory = this.retrieveMemory(userMessage);

                this.conversationHistory.push({role: 'user', content: userMessage});

                let response = '';
                const confidence = Math.min(0.95, 0.7 + (userMessage.length * 0.001));

                if (ambiguity > 0.8) {
                    response = `I want to help you better. Could you provide more details about "${userMessage.substring(0, 30)}..."?`;
                } else if (intent === 'request-explanation') {
                    response = `That's an interesting question about "${userMessage.substring(0, 40)}". Based on my learning, I can tell you that this is a complex topic that involves many interconnected concepts. If you'd like, I can break it down into smaller, more manageable parts. What aspect would you like to explore further?`;
                } else if (intent === 'request-information') {
                    response = `You're asking about "${userMessage.substring(0, 40)}". From my memory and learning systems, I've gathered that this relates to several key points. I'm continuously learning from our conversations to provide better answers. Could you be more specific about what you'd like to know?`;
                } else if (intent === 'request-creation') {
                    response = `Great! You want to create or generate something related to "${userMessage.substring(0, 40)}". Let me break this down into steps: 1) First, we need to understand your requirements, 2) Then, we'll plan the approach, 3) Finally, we'll execute the plan. What would you like to create?`;
                } else if (intent === 'memory-access') {
                    if (relevantMemory.length > 0) {
                        response = `Yes, I remember our previous conversations! I found ${relevantMemory.length} relevant memory item(s) about this topic. Based on what you've told me before, I can provide a more informed response. What specifically would you like me to recall?`;
                    } else {
                        response = `I don't have previous memories about this specific topic yet, but I'm learning! Tell me more and I'll remember it for our future conversations.`;
                    }
                } else {
                    response = `That's interesting! You mentioned "${userMessage.substring(0, 40)}". I'm here to help and learn from our interactions. My adaptive learning system is continuously improving based on your feedback. What would you like to know more about?`;
                }

                this.conversationHistory.push({role: 'helen', content: response});
                this.storeMemory('conversation', `Q: ${userMessage} A: ${response}`, ['conversation-history']);

                return {
                    response,
                    metadata: {
                        intent,
                        confidence,
                        ambiguity,
                        memoryUsed: relevantMemory.length
                    }
                };
            }

            storeMemory(type, content, tags) {
                const memory = {
                    id: Date.now().toString(),
                    type,
                    content,
                    timestamp: new Date(),
                    tags
                };
                const memories = this.memory.get(type) || [];
                memories.push(memory);
                this.memory.set(type, memories);
            }

            recordFeedback(rating) {
                this.feedbackLog.push({rating, timestamp: new Date()});
                if (rating === 'helpful') this.successfulResponses++;
            }

            getStats() {
                return {
                    totalInteractions: this.interactionCount,
                    successRate: this.interactionCount > 0 ? (this.successfulResponses / this.interactionCount * 100).toFixed(1) : 0,
                    learningCycles: this.feedbackLog.length
                };
            }
        }

        // UI Logic
        const helen = new HELEN();
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        let isFirstMessage = true;

        function updateStats() {
            const stats = helen.getStats();
            document.getElementById('msgCount').textContent = stats.totalInteractions;
            document.getElementById('successRate').textContent = stats.successRate !== 0 ? stats.successRate + '%' : '-';
            document.getElementById('learningCycles').textContent = stats.learningCycles;
            document.getElementById('avgConfidence').textContent = '~85%';
        }

        function addMessage(text, isUser, metadata = null) {
            if (isFirstMessage) {
                messagesDiv.innerHTML = '';
                isFirstMessage = false;
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user' : 'helen'}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = isUser ? '👤' : '🧠';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;
            
            msgDiv.appendChild(avatar);
            msgDiv.appendChild(content);
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showTyping() {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message helen';
            msgDiv.id = 'typing-indicator';
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = '🧠';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerHTML = '<div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
            
            msgDiv.appendChild(avatar);
            msgDiv.appendChild(content);
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typing-indicator');
            if (typing) typing.remove();
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            addMessage(text, true);
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendBtn.disabled = true;

            showTyping();
            
            setTimeout(async () => {
                const result = await helen.generateResponse(text);
                removeTyping();
                addMessage(result.response, false);
                updateStats();
                sendBtn.disabled = false;
                messageInput.focus();
            }, 800);
        }

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        });

        sendBtn.addEventListener('click', sendMessage);

        // Initial focus
        messageInput.focus();
    </script>
</body>
</html>
